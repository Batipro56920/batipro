name: Deploy intervenant Edge Function

on:
  push:
    branches:
      - dev
    paths:
      - "supabase/functions/generate-intervenant-link/**"
      - ".github/workflows/deploy-intervenant-function.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy generate-intervenant-link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          fi
          supabase functions deploy generate-intervenant-link --project-ref vhwtpwmzaidmlvqcyfep
