name: Temporary Patch Devis Extraction Hardening V2

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Harden devis task extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/services/devisTasksExtraction.service.ts')
          raw = path.read_bytes()
          has_bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')
          original = text

          text = text.replace(
              '  /\\b(total|sous-?total|tva|ttc|ht|remise)\\b/i,',
              '  /\\b(total|sous-?total|ttc|remise)\\b/i,',
          )

          parse_number_new = '''function parseNumber(value: unknown): number | null {
  if (value === null || value === undefined || value === "") return null;
  const raw = String(value)
    .trim()
    .replace(/[\\s\\u00A0]/g, "")
    .replace(/€/g, "");
  if (!raw) return null;

  const normalized = raw.includes(",")
    ? raw.replace(/\\./g, "").replace(",", ".")
    : raw.replace(/,(?=\\d{3}\\b)/g, "");
  const n = Number(normalized);
  return Number.isFinite(n) ? n : null;
}

function normalizeConfidence'''
          text, parse_count = re.subn(
              r'function parseNumber\(value: unknown\): number \| null \{.*?\}\n\nfunction normalizeConfidence',
              parse_number_new,
              text,
              count=1,
              flags=re.S,
          )
          if parse_count != 1:
              raise SystemExit('parseNumber block not found; refusing to patch.')

          normalize_date_new = '''function normalizeDate(value: unknown): string | null {
  const raw = String(value ?? "").trim();
  if (!raw) return null;
  if (/^\\d{4}-\\d{2}-\\d{2}$/.test(raw)) return raw;

  const french = raw.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})$/);
  if (french) {
    const day = Number(french[1]);
    const month = Number(french[2]);
    const year = Number(french[3]);
    const date = new Date(Date.UTC(year, month - 1, day));
    if (date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day) {
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
  }

  return null;
}

function normalizeLot'''
          text, date_count = re.subn(
              r'function normalizeDate\(value: unknown\): string \| null \{.*?\}\n\nfunction normalizeLot',
              normalize_date_new,
              text,
              count=1,
              flags=re.S,
          )
          if date_count != 1:
              raise SystemExit('normalizeDate block not found; refusing to patch.')

          if text != original:
              out = text.encode('utf-8')
              if has_bom:
                  out = b'\xef\xbb\xbf' + out
              path.write_bytes(out)
          PY

      - name: Remove temporary workflows and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-devis-extraction-hardening.yml
          rm -f .github/workflows/patch-devis-extraction-hardening-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/devisTasksExtraction.service.ts .github/workflows/patch-devis-extraction-hardening.yml .github/workflows/patch-devis-extraction-hardening-v2.yml
          git commit -m "fix: harden quote task extraction parsing"
          git push origin HEAD:dev
