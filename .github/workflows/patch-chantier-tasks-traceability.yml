name: Temporary Patch Chantier Task Traceability

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch chantierTasks traceability fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/chantierTasks.service.ts')
          raw = path.read_bytes()
          has_bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          old = "\n".join([
              '  const legacyInsert = stripTaskV2Columns({ ...baseInsert });',
              '  delete (legacyInsert as Record<string, unknown>).devis_ligne_id;',
              '',
              '  const fallback = await supabase',
              '    .from("chantier_tasks")',
              '    .insert([legacyInsert])',
              '    .select(TASK_SELECT_LEGACY)',
              '    .single();',
              '',
              '  if (fallback.error) throw fallback.error;',
              '  return normalizeTaskRow(fallback.data);',
              '',
          ])

          new = "\n".join([
              '  const legacyInsert = stripTaskV2Columns({ ...baseInsert });',
              '',
              '  const fallback = await supabase',
              '    .from("chantier_tasks")',
              '    .insert([legacyInsert])',
              '    .select(`${TASK_SELECT_LEGACY},devis_ligne_id`)',
              '    .single();',
              '',
              '  if (!fallback.error) {',
              '    return normalizeTaskRow(fallback.data);',
              '  }',
              '',
              '  if (!isMissingTaskColumnError(fallback.error, "devis_ligne_id")) {',
              '    throw fallback.error;',
              '  }',
              '',
              '  const legacyInsertWithoutDevisLine = { ...legacyInsert };',
              '  delete (legacyInsertWithoutDevisLine as Record<string, unknown>).devis_ligne_id;',
              '',
              '  const fallbackWithoutDevisLine = await supabase',
              '    .from("chantier_tasks")',
              '    .insert([legacyInsertWithoutDevisLine])',
              '    .select(TASK_SELECT_LEGACY)',
              '    .single();',
              '',
              '  if (fallbackWithoutDevisLine.error) throw fallbackWithoutDevisLine.error;',
              '  return normalizeTaskRow(fallbackWithoutDevisLine.data);',
              '',
          ])

          if old not in text:
              raise SystemExit('Target fallback block not found; refusing to patch.')

          text = text.replace(old, new, 1)
          out = text.encode('utf-8')
          if has_bom:
              out = b'\xef\xbb\xbf' + out
          path.write_bytes(out)
          PY

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/patch-chantier-tasks-traceability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/chantierTasks.service.ts .github/workflows/patch-chantier-tasks-traceability.yml
          git commit -m "fix: preserve devis line link in task fallback"
          git push origin HEAD:dev
