name: Temporary Patch Devis Extraction Hardening

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Harden devis task extraction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/devisTasksExtraction.service.ts')
          raw = path.read_bytes()
          has_bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          replacements = [
              (
                  '  /\\b(total|sous-?total|tva|ttc|ht|remise)\\b/i,',
                  '  /\\b(total|sous-?total|ttc|remise)\\b/i,',
              ),
              (
                  '''function parseNumber(value: unknown): number | null {
  if (value === null || value === undefined || value === "") return null;
  const n = Number(String(value).trim().replace(/\s/g, "").replace(",", "."));
  return Number.isFinite(n) ? n : null;
}
''',
                  '''function parseNumber(value: unknown): number | null {
  if (value === null || value === undefined || value === "") return null;
  const raw = String(value)
    .trim()
    .replace(/[\s\u00A0]/g, "")
    .replace(/€/g, "");
  if (!raw) return null;

  const normalized = raw.includes(",")
    ? raw.replace(/\./g, "").replace(",", ".")
    : raw.replace(/,(?=\d{3}\b)/g, "");
  const n = Number(normalized);
  return Number.isFinite(n) ? n : null;
}
''',
              ),
              (
                  '''function normalizeDate(value: unknown): string | null {
  const raw = String(value ?? "").trim();
  if (!raw) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  return null;
}
''',
                  '''function normalizeDate(value: unknown): string | null {
  const raw = String(value ?? "").trim();
  if (!raw) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;

  const french = raw.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (french) {
    const day = Number(french[1]);
    const month = Number(french[2]);
    const year = Number(french[3]);
    const date = new Date(Date.UTC(year, month - 1, day));
    if (date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day) {
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
  }

  return null;
}
''',
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Target block not found; refusing to patch: {old[:80]}')
              text = text.replace(old, new, 1)

          out = text.encode('utf-8')
          if has_bom:
              out = b'\xef\xbb\xbf' + out
          path.write_bytes(out)
          PY

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/patch-devis-extraction-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/devisTasksExtraction.service.ts .github/workflows/patch-devis-extraction-hardening.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "fix: harden quote task extraction parsing"
            git push origin HEAD:dev
          fi
