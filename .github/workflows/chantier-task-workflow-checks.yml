name: Chantier task workflow checks
on:
  push:
    branches: [fix/chantier-task-workflow-20261120]
  pull_request:
    paths:
      - "src/pages/ChantierPage.tsx"
      - "src/features/chantiers/pages/ChantierPreparationSection.tsx"
      - ".github/workflows/chantier-task-workflow-checks.yml"
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: ESLint
        run: npx eslint src/pages/ChantierPage.tsx src/features/chantiers/pages/ChantierPreparationSection.tsx
      - name: Production build
        run: npm run build
