name: Temporary Patch Import Devis Rollback

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch import devis rollback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/chantiers/DevisImportDrawer.tsx')
          raw = path.read_bytes()
          has_bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          replacements = [
              (
                  'import { createDevis, createDevisLigne, deleteDevis } from "../../services/devis.service";',
                  'import { createDevis, createDevisLigne, deleteDevis, deleteDevisLigne } from "../../services/devis.service";',
              ),
              (
                  '    const createdTaskIds: string[] = [];\n',
                  '    const createdTaskIds: string[] = [];\n    const createdDevisLigneIds: string[] = [];\n',
              ),
              (
                  '        });\n        ordre += 1;\n\n        // If the imported unit is hours, reuse quantity as planned hours',
                  '        });\n        createdDevisLigneIds.push(createdLigne.id);\n        ordre += 1;\n\n        // If the imported unit is hours, reuse quantity as planned hours',
              ),
              (
                  '      try {\n        if (createdDevisId) await deleteDevis(createdDevisId);\n      } catch (cleanupErr: any) {\n        cleanupErrors.push(`Rollback devis: ${cleanupErr?.message ?? cleanupErr}`);\n      }\n',
                  '      try {\n        for (const ligneId of [...createdDevisLigneIds].reverse()) {\n          await deleteDevisLigne(ligneId);\n        }\n      } catch (cleanupErr: any) {\n        cleanupErrors.push(`Rollback lignes devis: ${cleanupErr?.message ?? cleanupErr}`);\n      }\n\n      try {\n        if (createdDevisId) await deleteDevis(createdDevisId);\n      } catch (cleanupErr: any) {\n        cleanupErrors.push(`Rollback devis: ${cleanupErr?.message ?? cleanupErr}`);\n      }\n',
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Target block not found; refusing to patch: {old[:80]}')
              text = text.replace(old, new, 1)

          out = text.encode('utf-8')
          if has_bom:
              out = b'\xef\xbb\xbf' + out
          path.write_bytes(out)
          PY

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/patch-import-devis-rollback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/chantiers/DevisImportDrawer.tsx .github/workflows/patch-import-devis-rollback.yml
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "fix: rollback imported quote lines on task creation failure"
            git push origin HEAD:dev
          fi
