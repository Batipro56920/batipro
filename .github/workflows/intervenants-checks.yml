name: Intervenants PR checks
on:
  pull_request:
    paths:
      - "src/components/intervenants/**"
      - "src/pages/IntervenantsPage.tsx"
      - "src/pages/IntervenantDetailPage.tsx"
      - "src/services/intervenants.service.ts"
      - ".github/workflows/intervenants-checks.yml"
  push:
    branches:
      - feat/intervenants-directory-unified-20261119
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: Targeted ESLint
        run: npx eslint src/components/intervenants/IntervenantFormFields.tsx src/pages/IntervenantsPage.tsx src/pages/IntervenantDetailPage.tsx
